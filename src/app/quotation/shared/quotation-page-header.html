<section class="flex items-start justify-between gap-4 flex-wrap">
  <div class="flex items-start gap-3">
    <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0 mt-0.5">
      <svg [lucideIcon]="'file-text' | iconOf" class="w-5 h-5 text-blue-600"></svg>
    </div>
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1 class="text-[20px] font-bold text-slate-900 tracking-tight">{{ title() }}</h1>
        @if (editableStatus()) {
          <select
            class="quotation-status-badge cursor-pointer"
            [class]="statusTone()"
            aria-label="Quotation status"
            [(ngModel)]="quotation().header.status"
          >
            @for (status of statuses; track status) {
              <option [value]="status">{{ status }}</option>
            }
          </select>
        } @else {
          <span class="quotation-status-badge" [class]="statusTone()">{{ quotation().header.status || 'Draft' }}</span>
        }
      </div>
      <p class="text-[12px] text-slate-500 mt-1">{{ subtitle() }}</p>
    </div>
  </div>

  <div class="flex items-center gap-2 flex-shrink-0 flex-wrap">
    @if (modeLabel()) {
      <span class="text-[11px] font-semibold uppercase tracking-wide text-slate-400 px-2.5 py-1.5 rounded-lg bg-slate-100">{{ modeLabel() }}</span>
    }
    @if (showNewButton()) {
      <button type="button" class="action-secondary" (click)="newQuotation.emit()">
        <svg [lucideIcon]="'plus' | iconOf" class="w-3.5 h-3.5"></svg>New
      </button>
    }
    <button type="button" class="action-secondary" (click)="exportPdf.emit()">
      <svg [lucideIcon]="'file-pdf' | iconOf" class="w-3.5 h-3.5"></svg>PDF
    </button>
    <button type="button" class="action-secondary" (click)="send.emit()">
      <svg [lucideIcon]="'mail' | iconOf" class="w-3.5 h-3.5"></svg>Send
    </button>
    <button type="button" class="action-primary" (click)="save.emit()">
      <svg [lucideIcon]="'save' | iconOf" class="w-3.5 h-3.5"></svg>Save
    </button>
  </div>
</section>
